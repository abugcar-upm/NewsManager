<div class="navbar">
    <nav class="navbar navbar-expand-lg ms-4 me-5 justify-content-between">
        <div class="navbar-nav">
            <a class="nav-link" [routerLink]="['/']" routerLinkActive="active">All articles</a>
            <a class="nav-link" [routerLink]="['/national']" routerLinkActive="active">National</a>
            <a class="nav-link" [routerLink]="['/international']" routerLinkActive="active">International</a>
            <a class="nav-link" [routerLink]="['/sports']" routerLinkActive="active">Sports</a>
            <a class="nav-link" [routerLink]="['/technology']" routerLinkActive="active">Technology</a>
            <a class="nav-link" [routerLink]="['/economy']" routerLinkActive="active">Economy</a>
        </div>
        <div class="d-flex">
            <form class="form-inline">
                <input class="form-control" type="search" placeholder="Search articles"  [(ngModel)]="term" name="filter">
            </form>
            <button class="btn btn-primary ms-3" [routerLink]="['/create']">Create Article</button>
        </div>
    </nav>
</div>
<br>
<div class="articles-list">
    <div class="articles-container">
        <div class="card mb-3" *ngFor="let article of (filteredArticles$ | async | filter:term)">
            <img class="card-img-top"
                style="cursor: pointer;"
                [src]="'data:' + article.thumbnail_media_type + ';base64,' + article.thumbnail_image"
                [alt]="article.title"
                [routerLink]="['/article', article.id]"
            >
            <div class="card-body">
                <p [innerHTML]="article.category | titlecase"></p>
                <h5 class="card-title" style="cursor: pointer;" [innerHTML]="article.title" [routerLink]="['/article', article.id]"></h5>
                <h6 class="card-subtitle mb-2 text-muted" [innerHTML]="article.subtitle"></h6>
                <p class="card-text" [innerHTML]="article.abstract"></p>
                <button class="btn btn-primary btn-sm me-2" [routerLink]="['/edit', article.id]">            
                    Edit
                </button>
                <button class="btn btn-danger btn-sm">
                    Remove
                </button>
            </div>
        </div>
    </div>
</div>
