<h1>EIT Newspaper</h1>
<div class="navbar">
    <nav class="navbar navbar-expand-lg ms-4 me-5 justify-content-between">
        <div class="navbar-nav">
            <a class="nav-item nav-link" [routerLink]="['/']" routerLinkActive="active">All</a>
            <a class="nav-item nav-link" [routerLink]="['/']" [queryParams]="{'category':'national'}" routerLinkActive="active">National</a>
            <a class="nav-item nav-link" [routerLink]="['/']" [queryParams]="{'category':'international'}" routerLinkActive="active">International</a>
            <a class="nav-item nav-link" [routerLink]="['/']" [queryParams]="{'category':'sports'}" routerLinkActive="active">Sports</a>
            <a class="nav-item nav-link" [routerLink]="['/']" [queryParams]="{'category':'economy'}" routerLinkActive="active">Technology</a>
        </div>
        <div class="d-flex">
            <form class="form-inline">
                <input class="form-control" type="search" placeholder="Search articles"  [(ngModel)]="term" name="filter">
            </form>
            <button class="btn btn-primary ms-3">Create Article</button>
        </div>
    </nav>
</div>
<br>
